<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self' data:; base-uri 'none'">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#3B1119">
  <link rel="icon" href="/favicon.ico?v=logo-bordeaux" sizes="16x16 32x32 48x48">
  <link rel="icon" href="/favicon-32.png?v=logo-bordeaux" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=logo-bordeaux">
  <title>Seite nicht gefunden · Feinbäckerei Friedenau</title>
  <!-- Absichtlich komplett eigenständig (Inline-CSS, keine relativen Assets),
       damit die Seite auf jeder Pfadtiefe funktioniert – auch bei GitHub-Pages-Projektseiten. -->
  <style>
    *{box-sizing:border-box;margin:0}
    body{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:#3B1119;color:#F4EBD9;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;text-align:center;line-height:1.6}
    main{max-width:520px}
    .code{font-family:Georgia,"Times New Roman",serif;font-style:italic;font-size:clamp(5rem,22vw,9rem);line-height:1;color:#C9933E}
    h1{font-family:Georgia,"Times New Roman",serif;font-weight:600;font-size:clamp(1.6rem,6vw,2.2rem);margin:.5rem 0 1rem}
    p{color:rgba(244,235,217,.8)}
    .actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:2rem}
    a{display:inline-flex;align-items:center;min-height:48px;padding:.8rem 1.4rem;border-radius:999px;font-weight:600;text-decoration:none}
    .gold{background:#C9933E;color:#2A0B11}
    .ghost{border:1.5px solid rgba(244,235,217,.45);color:#F4EBD9}
    a:focus-visible{outline:3px solid #C9933E;outline-offset:3px}
  </style>
</head>
<body>
  <main>
    <p class="code" aria-hidden="true">404</p>
    <h1>Dieses Gebäck ist leider schon weg.</h1>
    <p>Die Seite gibt es nicht (mehr). Unser frisches Sortiment finden Sie auf der Startseite.</p>
    <div class="actions">
      <a class="gold" href="/" id="home">Zur Startseite</a>
      <a class="ghost" href="https://wolt.com/de/deu/berlin/venue/feinbckerei-friedenau" rel="noopener">Auf Wolt bestellen</a>
    </div>
  </main>
</body>
</html>
